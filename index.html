<style>
/* Layout: arcade "sticker" cards on a dot-grid playfield, one centered column (max 860px) */
:root{
  --bg:#EEF2F8; --dots:#D3DAE8; --panel:#FFFFFF; --panel2:#F6F8FC;
  --ink:#16172B; --muted:#5A607A; --edge:#16172B; --shadow:#16172B;
  --accent:#2F5BFF; --accent-ink:#FFFFFF; --gold:#FFB81F; --gold-ink:#3A2600;
  --good:#16A05A; --good-bg:#E3F6EB; --bad:#D93A42; --bad-bg:#FCE7E8;
  --d1:#FF6B3D; --d2:#00A3A3; --d3:#8457F0; --d4:#E7A800; --d5:#E2468A;
  --display:"Bungee","Arial Black",Impact,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#11121E; --dots:#24263A; --panel:#1B1D2E; --panel2:#222538;
  --ink:#F1F0FF; --muted:#A3A7C2; --edge:#C9C7F2; --shadow:#000000;
  --accent:#6E8BFF; --accent-ink:#0B0D1A; --gold:#FFC94D; --gold-ink:#2A1C00;
  --good:#3DD68C; --good-bg:#12301F; --bad:#FF6B72; --bad-bg:#3A1619;
  --d1:#FF8A61; --d2:#2CCFCF; --d3:#A585FF; --d4:#FFCB3D; --d5:#FF6FAE;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#11121E; --dots:#24263A; --panel:#1B1D2E; --panel2:#222538;
  --ink:#F1F0FF; --muted:#A3A7C2; --edge:#C9C7F2; --shadow:#000000;
  --accent:#6E8BFF; --accent-ink:#0B0D1A; --gold:#FFC94D; --gold-ink:#2A1C00;
  --good:#3DD68C; --good-bg:#12301F; --bad:#FF6B72; --bad-bg:#3A1619;
  --d1:#FF8A61; --d2:#2CCFCF; --d3:#A585FF; --d4:#FFCB3D; --d5:#FF6FAE;
  color-scheme:dark; }

*{box-sizing:border-box}
body{background:var(--bg);background-image:radial-gradient(var(--dots) 1.2px,transparent 1.3px);background-size:22px 22px;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;}
.wrap{max-width:860px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(2.2rem,7vw,3.6rem);line-height:1}
h2{font-size:1.35rem;line-height:1.15}
h3{font-size:1.02rem;line-height:1.2}
p{margin:0}
code{font-family:var(--mono);font-size:.86em;background:var(--panel2);border:1px solid color-mix(in srgb,var(--edge) 25%,transparent);padding:.05em .35em;border-radius:5px;word-break:break-word}
.card{background:var(--panel);border:2.5px solid var(--edge);border-radius:14px;box-shadow:5px 5px 0 var(--shadow);padding:20px;min-width:0}
.muted{color:var(--muted)}
.eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.btn{font-family:var(--body);font-weight:800;font-size:1rem;cursor:pointer;border:2.5px solid var(--edge);border-radius:12px;padding:11px 18px;background:var(--panel);color:var(--ink);box-shadow:3px 3px 0 var(--shadow);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.opt:focus-visible,.chip:focus-visible,.navdot:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.gold{background:var(--gold);color:var(--gold-ink)}
.btn.small{padding:7px 12px;font-size:.88rem;border-width:2px;box-shadow:2px 2px 0 var(--shadow)}
.btn.ghost{box-shadow:none;border-color:transparent;background:transparent;text-decoration:underline;text-underline-offset:3px}
.btn.ghost:hover{transform:none;box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.8rem;border:2px solid var(--edge);border-radius:999px;padding:3px 10px;background:var(--panel2);color:var(--ink);cursor:default}
button.chip{cursor:pointer;font-family:var(--body)}
.chip.sel{background:var(--ink);color:var(--panel)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1.5px solid var(--edge);flex:none}
.bar{height:12px;border:2px solid var(--edge);border-radius:999px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-right:2px solid var(--edge)}
.bar>i[style*="width:0%"]{border-right:none}
.tnum{font-variant-numeric:tabular-nums}

/* hero */
.hero{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
.hero .title{display:flex;flex-direction:column;gap:10px;min-width:0}
.hero h1 span{color:var(--accent)}
.badge{width:118px;height:118px;border-radius:50%;border:3px solid var(--edge);box-shadow:4px 4px 0 var(--shadow);background:var(--gold);color:var(--gold-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px}
.badge b{font-family:var(--display);font-size:2rem;line-height:1}
.badge small{font-weight:800;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--panel2);border:2px solid var(--edge);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:1.4rem;line-height:1.1}
.stat span{font-size:.78rem;font-weight:700;color:var(--muted)}
@media (max-width:560px){.hero{grid-template-columns:1fr}.badge{width:96px;height:96px}.stats{grid-template-columns:repeat(2,1fr)}}

/* worlds */
.world{display:flex;flex-direction:column;gap:10px;border-top:8px solid var(--c)}
.world .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.world .pct{font-family:var(--display);font-size:1.1rem;color:var(--c);white-space:nowrap}
.world .bar>i{background:var(--c)}

/* mode cards */
.mode{display:flex;flex-direction:column;gap:12px}
.mode .tag{align-self:flex-start}
.mode p{color:var(--muted)}
.mode .btn{margin-top:auto;align-self:flex-start}

/* quiz */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--panel);border:2.5px solid var(--edge);border-radius:14px;box-shadow:4px 4px 0 var(--shadow);padding:10px 14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.hud .grow{flex:1;min-width:120px}
.hud .label{font-family:var(--display);font-size:.95rem}
.timer{font-family:var(--display);font-size:1.15rem;padding:2px 10px;border:2px solid var(--edge);border-radius:10px;background:var(--panel2)}
.timer.warn{background:var(--bad);color:#fff}
.scen{border-left:6px solid var(--c,var(--accent));background:var(--panel2);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.scen summary{cursor:pointer;font-weight:800}
.qtext{font-size:1.14rem;font-weight:700;line-height:1.5}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;font:inherit;color:var(--ink);background:var(--panel);border:2.5px solid var(--edge);border-radius:12px;padding:12px 14px;cursor:pointer;box-shadow:3px 3px 0 var(--shadow);transition:transform .08s,box-shadow .08s,background .15s}
.opt:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow);background:var(--panel2)}
.opt:disabled{cursor:default}
.opt .k{width:34px;height:34px;border-radius:9px;border:2px solid var(--edge);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:.95rem;background:var(--panel2)}
.opt .t{min-width:0;padding-top:4px}
.opt.picked{background:var(--panel2);outline:3px solid var(--accent);outline-offset:-1px}
.opt.picked .k{background:var(--accent);color:var(--accent-ink)}
.opt.right{background:var(--good-bg);border-color:var(--good)}
.opt.right .k{background:var(--good);color:#fff;border-color:var(--good)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad)}
.opt.wrong .k{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.dim{opacity:.55}
.fb{border-radius:12px;border:2.5px solid var(--edge);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.fb.ok{background:var(--good-bg);border-color:var(--good)}
.fb.no{background:var(--bad-bg);border-color:var(--bad)}
.fb .head{font-family:var(--display);font-size:1.1rem}
.fb.ok .head{color:var(--good)} .fb.no .head{color:var(--bad)}
.shake{animation:shake .35s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.pop{animation:pop .4s}
@keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.02)}100%{transform:none}}
.kbd{font-family:var(--mono);font-size:.75rem;border:1.5px solid var(--muted);border-radius:5px;padding:0 5px;color:var(--muted)}
.qfoot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}

/* summary */
.score{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center}
.ring{width:140px;height:140px;position:relative;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .v b{font-family:var(--display);font-size:2rem;line-height:1}
.ring .v span{font-size:.75rem;font-weight:800;color:var(--muted)}
@media (max-width:520px){.score{grid-template-columns:1fr;justify-items:center;text-align:center}}
.dline{display:grid;grid-template-columns:minmax(0,1fr) 110px 52px;gap:10px;align-items:center;font-weight:700;font-size:.93rem}
.dline .bar>i{background:var(--c)}
.weak{display:flex;flex-direction:column;gap:8px}
.weak li{list-style:none;display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--panel2);border:2px solid var(--edge);border-radius:10px;padding:8px 12px;font-weight:700;font-size:.92rem}
.weak ul{padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
details.rev{border:2px solid var(--edge);border-radius:10px;background:var(--panel2);padding:10px 14px}
details.rev summary{cursor:pointer;font-weight:700}
details.rev .body{display:flex;flex-direction:column;gap:8px;margin-top:10px;font-size:.95rem}
.ans{border-radius:8px;padding:6px 10px;border:2px solid}
.ans.ok{border-color:var(--good);background:var(--good-bg)}
.ans.no{border-color:var(--bad);background:var(--bad-bg)}
.pass{font-family:var(--display);font-size:1.6rem;padding:4px 14px;border-radius:10px;border:2.5px solid var(--edge);display:inline-block}
.pass.y{background:var(--good);color:#fff}.pass.n{background:var(--bad);color:#fff}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px}
.navdot{height:34px;border:2px solid var(--edge);border-radius:8px;background:var(--panel2);font:800 .8rem var(--body);color:var(--ink);cursor:pointer;position:relative}
.navdot.done{background:var(--accent);color:var(--accent-ink)}
.navdot.cur{outline:3px solid var(--gold);outline-offset:1px}
.navdot.flag::after{content:"";position:absolute;top:-5px;right:-5px;width:10px;height:10px;border-radius:50%;background:var(--gold);border:2px solid var(--edge)}
.navdot:disabled{opacity:.35;cursor:not-allowed}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.facts div{background:var(--panel2);border:2px solid var(--edge);border-radius:10px;padding:10px 12px}
.facts b{display:block;font-family:var(--display);font-size:1.2rem}
.facts span{font-size:.8rem;font-weight:700;color:var(--muted)}
.confirm{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:var(--bad-bg);border:2px solid var(--bad);border-radius:10px;padding:10px 12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);font-weight:800;padding:10px 16px;border-radius:12px;z-index:20;box-shadow:3px 3px 0 var(--shadow)}
.tutor{border:2.5px dashed var(--accent);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--panel)}
.tutor .th{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tutor .th h3{font-size:.98rem}
.tutor .av{width:30px;height:30px;border-radius:9px;border:2px solid var(--edge);background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:.85rem;flex:none}
.msgs{display:flex;flex-direction:column;gap:8px}
.msg{border-radius:10px;padding:9px 12px;max-width:100%;min-width:0;overflow-wrap:anywhere;font-size:.95rem}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);font-weight:700;max-width:85%}
.msg.a{align-self:flex-start;background:var(--panel2);border:2px solid var(--edge)}
.msg.a ul{margin:4px 0;padding-left:20px}
.msg.a p+p{margin-top:6px}
.msg.err{border-color:var(--bad)}
.tform{display:flex;gap:8px}
.tform input{flex:1;min-width:0;font:inherit;font-size:.95rem;padding:9px 12px;border:2.5px solid var(--edge);border-radius:10px;background:var(--panel2);color:var(--ink)}
.tform input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.sugs{display:flex;gap:6px;flex-wrap:wrap}
.tlink{font-weight:800;color:var(--accent)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
footer{font-size:.82rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.topnav{max-width:860px;margin:0 auto;padding:14px max(16px,env(safe-area-inset-left,0px)) 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.topnav .grow{flex:1}
.brand{font-family:var(--display);font-size:1.1rem;background:none;border:0;color:var(--ink);cursor:pointer;padding:0}
.brand span{color:var(--accent)}
.who{font-weight:800;font-size:.9rem;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.authf{display:flex;flex-direction:column;gap:12px}
.authf label{display:flex;flex-direction:column;gap:4px;font-weight:800;font-size:.9rem}
.authf input{font:inherit;font-weight:600;padding:10px 12px;border:2.5px solid var(--edge);border-radius:10px;background:var(--panel2);color:var(--ink)}
.authf input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);font-weight:800;font-size:.9rem;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}
.linkbtn:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
.authmsg .linkbtn{display:inline;font-size:inherit}
.authmsg{background:var(--panel2);border:2px solid var(--gold);border-radius:10px;padding:8px 12px;font-weight:700;font-size:.92rem}
.tblwrap{overflow-x:auto;margin:0 -6px}
table.lb{width:100%;border-collapse:collapse;font-size:.92rem}
.lb th{text-align:left;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px;border-bottom:2px solid var(--edge)}
.lb td{padding:8px 6px;border-bottom:1px solid color-mix(in srgb,var(--edge) 20%,transparent);vertical-align:top}
.lb .r{text-align:right;white-space:nowrap}
.lb tr.me td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.sm{font-size:.78rem}
.okc{color:var(--good);font-weight:800}
ul.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.feed li{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;background:var(--panel2);border:2px solid var(--edge);border-radius:10px;padding:8px 12px}
ul.feed li .sm{white-space:nowrap}
footer a{color:inherit}
@media (max-width:520px){.lb .hm{display:none}.who{display:none}}
</style>

function save(){P.t=Date.now();try{localStorage.setItem(userKey(),JSON.stringify(P));}catch(e){}cloudSave();}
let P=load(), BANK=[], ALL=[], BY={}, view="home", S=null, timerInt=null, homeConfirm=false, roundSize=20;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const app=()=>$("#app");
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function md(s){return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>");}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function cv(name){return `var(${name})`;}
function pct(c,n){return n?Math.round(100*c/n):0;}
function level(){return Math.floor(P.xp/LVL);}
function rank(){return RANKS[Math.min(level(),RANKS.length-1)];}
function stat(id){return P.qs[id]||{n:0,c:0,last:null};}
function fmtTime(ms){ms=Math.max(0,ms);const t=Math.floor(ms/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s).padStart(2,"0");}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}

function record(id,ok){const s=stat(id);s.n++;if(ok)s.c++;s.last=ok?1:0;P.qs[id]=s;}
function domainStats(){const r={};for(const d in DOMAINS)r[d]={n:0,c:0,seen:0,mastered:0,total:0};
 BANK.forEach(q=>{const s=stat(q.id),x=r[q.d];x.total++;x.n+=s.n;x.c+=s.c;if(s.n)x.seen++;if(s.last===1)x.mastered++;});return r;}
function taskStats(){const r={};BANK.forEach(q=>{const s=stat(q.id);const x=r[q.t]||(r[q.t]={t:q.t,d:q.d,n:0,c:0,total:0,missedNow:0});x.total++;x.n+=s.n;x.c+=s.c;if(s.last===0)x.missedNow++;});return r;}
function weakTasks(limit){return Object.values(taskStats()).filter(x=>x.n>0).map(x=>({...x,score:(x.c+1)/(x.n+2)})).filter(x=>x.score<0.8||x.missedNow>0).sort((a,b)=>a.score-b.score||b.missedNow-a.missedNow).slice(0,limit);}
function totals(){let n=0,c=0,seen=0,m=0;BANK.forEach(q=>{const s=stat(q.id);n+=s.n;c+=s.c;if(s.n)seen++;if(s.last===1)m++;});return {n,c,seen,m};}

/* priority: missed last time > unseen > least-practiced */
function prio(q){const s=stat(q.id);return (s.last===0?0:s.n===0?1:2)*1000+s.n+Math.random();}
function pickFrom(pool,k,exclude){const ex=exclude||new Set();return pool.filter(q=>!ex.has(q.id)).sort((a,b)=>prio(a)-prio(b)).slice(0,k);}

/* ---------- building rounds ---------- */
function buildPractice(n,dom){
 if(dom) return pickFrom(BY.d[dom],n);
 // split by guide weights (largest remainder)
 const raw=Object.keys(DOMAINS).map(d=>({d,x:n*DOMAINS[d].w/100}));
 raw.forEach(r=>r.k=Math.floor(r.x));let left=n-raw.reduce((a,r)=>a+r.k,0);
 raw.sort((a,b)=>(b.x-b.k)-(a.x-a.k)).forEach(r=>{if(left>0){r.k++;left--;}});
 let out=[];raw.forEach(r=>out=out.concat(pickFrom(BY.d[r.d],r.k)));return shuffle(out);
}
function buildDrill(n){
 const wt=weakTasks(4);const used=new Set();let out=[];
 if(wt.length){const per=Math.ceil(n/wt.length);wt.forEach(w=>{const got=pickFrom(BANK.filter(q=>q.t===w.t),per,used);got.forEach(q=>used.add(q.id));out=out.concat(got);});}
 // also pull any question missed last time
 if(out.length<n){const missed=BANK.filter(q=>stat(q.id).last===0&&!used.has(q.id));missed.forEach(q=>{if(out.length<n){out.push(q);used.add(q.id);}});}
 if(out.length<n){const ds=domainStats();const order=Object.keys(DOMAINS).sort((a,b)=>(ds[a].c+1)/(ds[a].n+2)-(ds[b].c+1)/(ds[b].n+2));
  for(const d of order){if(out.length>=n)break;const got=pickFrom(BY.d[d],n-out.length,used);got.forEach(q=>used.add(q.id));out=out.concat(got);}}
 return {qs:shuffle(out.slice(0,n)),tasks:wt.map(w=>w.t)};
}
function buildExam(){
 const scen=shuffle(Object.keys(SCEN)).slice(0,4).map(Number).sort((a,b)=>a-b);
 const seenInExam=new Set();(P.exams||[]).forEach(e=>(e.ids||[]).forEach(id=>seenInExam.add(id)));
 let qs=[];scen.forEach(s=>{const pool=shuffle(BY.s[s]).sort((a,b)=>(seenInExam.has(a.id)?1:0)-(seenInExam.has(b.id)?1:0));
  qs=qs.concat(pool.slice(0,PER_SCEN).sort((a,b)=>a.d-b.d||Math.random()-.5));});
 return {qs,scen};
}
function mkItems(qs){return qs.map(q=>({id:q.id,order:shuffle([0,1,2,3]),pick:null,flag:false}));}

/* ---------- start modes ---------- */
function startPractice(n,dom){const qs=buildPractice(n,dom);S={mode:"practice",label:dom?DOMAINS[dom].short:"Practice round",items:mkItems(qs),i:0,streak:0,xp0:P.xp,dom:dom||null};P.session=S;save();go("quiz");}
function startDrill(){const r=buildDrill(15);if(!r.qs.length){toast("Answer a few questions first so I can find your weak spots.");return;}S={mode:"drill",label:"Weak-spot drill",items:mkItems(r.qs),i:0,streak:0,xp0:P.xp,tasks:r.tasks};P.session=S;save();go("quiz");}
function startExam(){const r=buildExam();S={mode:"exam",label:"Final exam",items:mkItems(r.qs),i:0,scen:r.scen,start:Date.now(),end:Date.now()+EXAM_MIN*60000,xp0:P.xp,review:false};P.session=S;save();go("exam");}

const SETS={all:"All questions",1:"Set 1",2:"Set 2"};
function useSet(k){if(!ALL.some(q=>String(q.set)===String(k)))k="all";P.set=k;BANK=k==="all"?ALL:ALL.filter(q=>String(q.set)===String(k));
 BY={id:{},d:{},s:{}};ALL.forEach(q=>{BY.id[q.id]=q;});BANK.forEach(q=>{(BY.d[q.d]=BY.d[q.d]||[]).push(q);(BY.s[q.s]=BY.s[q.s]||[]).push(q);});}
function setPicker(){const n=k=>k==="all"?ALL.length:ALL.filter(q=>String(q.set)===k).length;if(n("2")===0)return "";
 return `<div class="row" role="group" aria-label="Question set"><span class="eyebrow">Question set</span>${["all","1","2"].map(k=>`<button class="chip ${String(P.set)===k?"sel":""}" data-set="${k}" aria-pressed="${String(P.set)===k}">${SETS[k]} · ${n(k)}</button>`).join("")}</div>`;}
function go(v){view=v;homeConfirm=false;render();window.scrollTo({top:0,behavior:"instant"in window?"instant":"auto"});}

/* ---------- render: practice / drill question ---------- */
function curQ(){return BY.id[S.items[S.i].id];}
function renderQuiz(){
 const it=S.items[S.i],q=curQ(),answered=it.pick!==null,D=DOMAINS[q.d],sc=SCEN[q.s];
 const ok=answered&&it.order[it.pick]===0;
 let h=`<div class="hud"><button class="btn small" data-act="home" aria-label="Back to home">Home</button>
  <div class="grow"><div class="label">${esc(S.label)} · <span class="tnum">${S.i+1}/${S.items.length}</span></div>
  <div class="bar" style="height:9px;margin-top:4px"><i style="width:${pct(S.i+(answered?1:0),S.items.length)}%"></i></div></div>
  <span class="chip tnum" title="Current streak">Streak ${S.streak}</span><span class="chip tnum" style="background:var(--gold);color:var(--gold-ink)">${P.xp} XP</span></div>
 <section class="card ${answered?(ok?"pop":"shake"):""}" id="qcard" style="display:flex;flex-direction:column;gap:16px">
  <div class="row"><span class="chip"><span class="dot" style="background:${cv(D.c)}"></span>D${q.d} · ${esc(D.short)}</span><span class="chip">Task ${q.t} · ${esc(TASKS[q.t])}</span></div>
  <details class="scen" open style="--c:${cv(sc.c)}"><summary>Scenario: ${esc(sc.name)}</summary><p class="muted">${esc(sc.text)}</p></details>
  <p class="qtext">${md(q.q)}</p>
  <div class="opts" role="group" aria-label="Answer options">`;
 it.order.forEach((oi,pos)=>{let cls="";if(answered){if(oi===0)cls="right";else if(pos===it.pick)cls="wrong";else cls="dim";}
  h+=`<button class="opt ${cls}" data-pos="${pos}" ${answered?"disabled":""}><span class="k">${"ABCD"[pos]}</span><span class="t">${md(q.o[oi])}</span></button>`;});
 h+=`</div>`;
 if(answered){const gain=it.gain||0;
  h+=`<div class="fb ${ok?"ok":"no"}"><div class="head">${ok?(S.streak>=3?"On fire! ":"Nailed it! ")+`<span class="tnum">+${gain} XP</span>`:"Not quite. The answer is "+"ABCD"[it.order.indexOf(0)]+"."}</div><p>${md(q.e)}</p></div>${tutorBox(q,it)}
  <div class="qfoot"><span class="muted" style="font-size:.85rem"><span class="kbd">Enter</span> next</span><button class="btn primary" data-act="next" id="nextbtn">${S.i+1<S.items.length?"Next question":"See my results"}</button></div>`;}
 else h+=`<div class="qfoot"><span class="muted" style="font-size:.85rem">Pick with <span class="kbd">A</span>–<span class="kbd">D</span> or <span class="kbd">1</span>–<span class="kbd">4</span></span></div>`;
 h+=`</section>`;
 app().innerHTML=h;
 if(answered){const b=$("#nextbtn");b&&b.focus({preventScroll:true});}
}
function answer(pos){
 const it=S.items[S.i];if(it.pick!==null)return;it.pick=pos;const ok=it.order[pos]===0;const q=curQ();
 record(q.id,ok);
 if(ok){S.streak++;it.gain=10+Math.min(10,2*(S.streak-1));P.xp+=it.gain;P.best=Math.max(P.best,S.streak);}else{S.streak=0;it.gain=0;}
 P.session=S;save();render();
 if(ok){const el=document.querySelector(".opt.right");if(el){const r=el.getBoundingClientRect();burst(r.left+30,r.top+r.height/2);}}
}
function next(){if(S.i+1<S.items.length){S.i++;P.session=S;save();render();window.scrollTo({top:0});}else{S.done=true;P.session=null;save();logAttempt(S.mode==="practice"&&S.dom?"domain":S.mode,S.label,S.items);go("summary");}}

/* ---------- render: summary ---------- */
function ringSVG(p,color){const r=58,c=2*Math.PI*r;return `<svg viewBox="0 0 140 140" aria-hidden="true"><circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--panel2)" stroke-width="16"/><circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--edge)" stroke-width="20" stroke-dasharray="${c*p/100} ${c}" /><circle cx="70" cy="70" r="${r}" fill="none" stroke="${color}" stroke-width="14" stroke-dasharray="${c*p/100} ${c}"/></svg>`;}
function breakdown(items,key,names,colorOf){const m={};items.forEach(it=>{const q=BY.id[it.id];const k=q[key];const x=m[k]||(m[k]={n:0,c:0});x.n++;if(it.pick!==null&&it.order[it.pick]===0)x.c++;});
 return Object.keys(m).sort().map(k=>`<div class="dline" style="--c:${colorOf(k)}"><span>${esc(names(k))}</span><div class="bar"><i style="width:${pct(m[k].c,m[k].n)}%"></i></div><span class="tnum" style="text-align:right">${m[k].c}/${m[k].n}</span></div>`).join("");}
function reviewList(items,onlyMissed){
 return items.map((it,i)=>({it,i})).filter(({it})=>!onlyMissed||it.order[it.pick]!==0).map(({it,i})=>{const q=BY.id[it.id];const ok=it.pick!==null&&it.order[it.pick]===0;
  return `<details class="rev" ${ok?"":"open"}><summary>${ok?"✓":"✗"} Q${i+1} · Task ${q.t} · ${esc(q.q.slice(0,90))}${q.q.length>90?"…":""}</summary><div class="body"><p><b>${md(q.q)}</b></p>
  ${!ok&&it.pick!==null?`<div class="ans no"><b>Your answer:</b> ${md(q.o[it.order[it.pick]])}</div>`:""}<div class="ans ok"><b>Correct:</b> ${md(q.o[0])}</div><p class="muted">${md(q.e)}</p>${tutorBox(q,it)}</div></details>`;}).join("");}
function renderSummary(){

 const missTasks={};items.forEach(it=>{if(it.order[it.pick]!==0){const t=BY.id[it.id].t;missTasks[t]=(missTasks[t]||0)+1;}});
 const mt=Object.entries(missTasks).sort((a,b)=>b[1]-a[1]);const wt=weakTasks(4);

 <section class="card" style="display:flex;flex-direction:column;gap:10px"><h3>This round by domain</h3>${breakdown(items,"d",k=>"D"+k+" · "+DOMAINS[k].short,k=>cv(DOMAINS[k].c))}</section>
 <section class="card weak" style="display:flex;flex-direction:column;gap:12px"><h3>Your weak spots</h3>
  ${mt.length?`<p class="muted">Missed this round:</p><ul>${mt.map(([t,k])=>`<li><span>Task ${t} · ${esc(TASKS[t])}</span><span class="chip tnum">${k} missed</span></li>`).join("")}</ul>`:`<p>No misses this round. Nice.</p>`}
  ${wt.length?`<p class="muted">Weakest overall (all-time):</p><ul>${wt.map(w=>`<li><span>Task ${w.t} · ${esc(TASKS[w.t])}</span><span class="chip tnum">${pct(w.c,w.n)}% of ${w.n}</span></li>`).join("")}</ul>`:""}
  <div class="row"><button class="btn gold" data-act="drill" ${totals().n?"":"disabled"}>Drill weak spots (15)</button><button class="btn primary" data-act="practice">New round</button><button class="btn" data-act="home">Home</button></div></section>
 ${c<n?`<section class="card" style="display:flex;flex-direction:column;gap:10px"><h3>Review what you missed</h3>${reviewList(items,true)}</section>`:""}`;
 app().innerHTML=h;
 if(p>=72)setTimeout(()=>{for(let i=0;i<4;i++)burst(innerWidth*(.2+.2*i),innerHeight*.25);},150);
}

function examScenIndex(){const q=curQ();return S.scen.indexOf(q.s)+1;}
function renderExam(){

   <label>Password<input name="password" type="password" required minlength="8" autocomplete="${up?"new-password":"current-password"}" placeholder="${up?"At least 8 characters":""}"></label>
   ${!up?`<button class="linkbtn" type="button" data-act="authforgot">Forgot password?</button>`:""}
   ${authMsg?`<p class="authmsg" role="alert">${esc(authMsg)}${canResend?` <button class="linkbtn" type="button" data-act="authresend" ${authBusy?"disabled":""}>Send the confirmation email again</button>`:""}</p>`:""}
   <div class="row"><button class="btn primary" type="submit" ${authBusy?"disabled":""}>${authBusy?"One moment…":up?"Create account":"Sign in"}</button><button class="btn small ghost" type="button" data-act="home">Keep playing as a guest</button></div>
  </form></section>`;
}
function ago(ts){const s=(Date.now()-new Date(ts))/1000;if(s<60)return "just now";if(s<3600)return Math.floor(s/60)+"m ago";if(s<86400)return Math.floor(s/3600)+"h ago";const d=Math.floor(s/86400);return d<30?d+"d ago":new Date(ts).toLocaleDateString();}
async function loadBoard(){
 boardErr="";
 try{
  const [p,a]=await Promise.all([
   SB.from("profiles").select("id,display_name,xp,seen,mastered,best_streak,updated_at").order("xp",{ascending:false}).limit(200),
   SB.from("attempts").select("user_id,mode,label,correct,total,scaled,passed,domains,created_at").order("created_at",{ascending:false}).limit(1000)]);
  if(p.error)throw p.error;if(a.error)throw a.error;
  BOARD={profiles:p.data,attempts:a.data,at:Date.now()};
 }catch(e){boardErr=(e&&e.message)||"Couldn't load the leaderboard.";}
 if(view==="board")render();
}
function renderBoard(){
 if(!BOARD&&!boardErr){app().innerHTML=`<section class="card"><h2>Loading the leaderboard…</h2></section>`;loadBoard();return;}
 if(boardErr){app().innerHTML=`<section class="card" style="display:flex;flex-direction:column;gap:10px"><h2>The leaderboard didn't load</h2><p class="muted">${esc(boardErr)}</p><div><button class="btn" data-act="boardreload">Try again</button></div></section>`;return;}
 const names={};BOARD.profiles.forEach(p=>names[p.id]=p.display_name);
 const per={};BOARD.attempts.forEach(a=>{const x=per[a.user_id]||(per[a.user_id]={c:0,n:0,rounds:0,exams:0,best:null,last:a.created_at});
  x.c+=a.correct;x.n+=a.total;if(a.mode==="exam"){x.exams++;if(a.scaled!=null)x.best=Math.max(x.best||0,a.scaled);}else x.rounds++;});
 const group={};let gc=0,gn=0;BOARD.attempts.forEach(a=>{Object.entries(a.domains||{}).forEach(([d,v])=>{const g=group[d]||(group[d]=[0,0]);g[0]+=v[0];g[1]+=v[1];gc+=v[0];gn+=v[1];});});
 const weakest=Object.entries(group).filter(([d,v])=>v[1]>=5).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1])[0];
 const active7=new Set(BOARD.attempts.filter(a=>Date.now()-new Date(a.created_at)<7*864e5).map(a=>a.user_id)).size;
 const rows=BOARD.profiles.filter(p=>p.xp>0||per[p.id]);
 let h=`<section class="card hero"><div class="title"><span class="eyebrow">Study group</span><h1 style="font-size:clamp(1.9rem,6vw,2.8rem)">Leader<span>board</span></h1>
   <p>${ME?`You're playing as <b>${esc(ME.name)}</b>.`:`<button class="btn small primary" data-act="auth">Sign in</button> to get on the board.`} Ranked by XP. Every finished round and exam counts.</p></div></section>
  <section class="stats">
   <div class="stat"><b class="tnum">${rows.length}</b><span>Players</span></div>
   <div class="stat"><b class="tnum">${active7}</b><span>Active this week</span></div>
   <div class="stat"><b class="tnum">${gn.toLocaleString()}</b><span>Questions answered</span></div>
   <div class="stat"><b class="tnum">${gn?pct(gc,gn)+"%":"–"}</b><span>Group accuracy</span></div>
  </section>
  <section class="card" style="display:flex;flex-direction:column;gap:12px"><h3>Rankings</h3>`;
 if(!rows.length)h+=`<p class="muted">Nobody's on the board yet. Finish a round to be first!</p>`;
 else{h+=`<div class="tblwrap"><table class="lb"><thead><tr><th>#</th><th>Player</th><th class="r">XP</th><th class="r hm">Seen</th><th class="r">Accuracy</th><th class="r">Best exam</th><th class="r hm">Active</th></tr></thead><tbody>`;
  rows.forEach((p,i)=>{const x=per[p.id]||{c:0,n:0,best:null,last:p.updated_at};const me=ME&&p.id===ME.id;
   h+=`<tr class="${me?"me":""}"><td class="tnum">${i<3?["🥇","🥈","🥉"][i]:i+1}</td><td><b>${esc(p.display_name)}</b>${me?' <span class="chip sm" style="padding:0 6px">you</span>':""}<div class="muted sm">${esc(RANKS[Math.min(Math.floor(p.xp/LVL),RANKS.length-1)])}</div></td>
   <td class="r tnum">${p.xp.toLocaleString()}</td><td class="r tnum hm">${p.seen}/${ALL.length}</td><td class="r tnum">${x.n?pct(x.c,x.n)+"%":"–"}</td>
   <td class="r tnum">${x.best!=null?`<span class="${x.best>=720?"okc":""}">${x.best}</span>`:"–"}</td><td class="r muted sm hm">${ago(x.last||p.updated_at)}</td></tr>`;});
  h+=`</tbody></table></div>`;}
 h+=`</section><section class="grid2"><div class="card" style="display:flex;flex-direction:column;gap:10px"><h3>Group progress by domain</h3>
  ${Object.keys(DOMAINS).map(d=>{const g=group[d]||[0,0],p=pct(g[0],g[1]);return `<div class="dline" style="--c:${cv(DOMAINS[d].c)}"><span>D${d} · ${esc(DOMAINS[d].short)}</span><div class="bar"><i style="width:${p}%"></i></div><span class="tnum">${g[1]?p+"%":"–"}</span></div>`;}).join("")}
  ${weakest?`<p class="muted" style="font-size:.9rem">The group's weakest area is <b>${esc(DOMAINS[weakest[0]].name)}</b>. <button class="btn small" data-act="domain" data-d="${weakest[0]}">Play 10 from it</button></p>`:""}</div>
  <div class="card" style="display:flex;flex-direction:column;gap:10px"><h3>Recent activity</h3>`;
 const feed=BOARD.attempts.slice(0,12);
 if(!feed.length)h+=`<p class="muted">No finished rounds yet.</p>`;
 else h+=`<ul class="feed">`+feed.map(a=>`<li><span><b>${esc(names[a.user_id]||"Someone")}</b> ${a.mode==="exam"?`took the final exam: <b class="tnum ${a.passed?"okc":""}">${a.scaled}</b>${a.passed?" (pass)":""}`:`scored <b class="tnum">${pct(a.correct,a.total)}%</b> on ${esc(a.label)} (${a.correct}/${a.total})`}</span><span class="muted sm">${ago(a.created_at)}</span></li>`).join("")+`</ul>`;
 h+=`</div></section>`;
 if(ME)h+=`<section class="card" style="display:flex;flex-direction:column;gap:10px"><h3>Your nickname</h3><form id="nameform" class="tform"><input name="dname" maxlength="24" required value="${esc(ME.name)}" aria-label="Nickname"><button class="btn small" type="submit">Save</button></form></section>`;
 h+=`<div class="row"><button class="btn" data-act="home">Back to practice</button><button class="btn small ghost" data-act="boardreload">Refresh</button></div>`;
 app().innerHTML=h;
}
async function saveName(form){const v=form.dname.value.trim().slice(0,24);if(!v)return;
 const {error}=await SB.from("profiles").update({display_name:v}).eq("id",ME.id);
 if(error){toast("Couldn't save that nickname.");return;}ME.name=v;BOARD=null;toast("Nickname saved");render();}
function renderNav(){
 const n=$("#nav");if(!n)return;
 if(!SB){n.innerHTML="";n.hidden=true;return;}
 n.hidden=false;
 n.innerHTML=`<button class="brand" data-act="home" aria-label="CCAF Quest home">CCAF <span>Quest</span></button><div class="grow"></div>
  <button class="btn small ${view==="board"?"primary":""}" data-act="board">Leaderboard</button>
  ${ME?`<button class="who btn small ghost" data-act="board" title="Change your nickname on the leaderboard page">${esc(ME.name)}</button><button class="btn small ghost" data-act="signout">Sign out</button>`:`<button class="btn small gold" data-act="auth">Sign in</button>`}`;
}
document.addEventListener("submit",e=>{
 if(e.target.id==="authform"){e.preventDefault();doAuth(e.target);}
 else if(e.target.id==="nameform"){e.preventDefault();saveName(e.target);}
});

/* ---------- main render & events ---------- */
function render(){
 clearInterval(timerInt);
 if(view==="home")renderHome();
 else if(view==="quiz")renderQuiz();
 else if(view==="summary")renderSummary();
 else if(view==="examintro")renderExamIntro();
 else if(view==="exam"){renderExam();timerInt=setInterval(tick,1000);tick();}
 else if(view==="examresult")renderExamResult();
 else if(view==="auth")renderAuth();
 else if(view==="board")renderBoard();
 renderNav();
}
document.addEventListener("click",e=>{
 const b=e.target.closest("button");if(!b)return;
 if(b.dataset.tsug){askTutor(b.dataset.tsug,b.textContent);return;}
 if(b.dataset.tstop){const T=TUT[b.dataset.tstop];if(T&&T.ctl)T.ctl.abort();return;}
 if(b.dataset.size){roundSize=+b.dataset.size;render();return;}
 if(b.dataset.set){useSet(b.dataset.set);save();render();return;}
 if(b.dataset.pos!==undefined){const pos=+b.dataset.pos;if(view==="quiz")answer(pos);else if(view==="exam"){S.items[S.i].pick=pos;P.session=S;save();render();}return;}
 if(b.dataset.jump!==undefined){S.i=+b.dataset.jump;S.review=false;S.nav=false;save();render();return;}
 const a=b.dataset.act;if(!a)return;
 ({home:()=>{go("home");},practice:()=>startPractice(roundSize),domain:()=>startPractice(10,+b.dataset.d),drill:startDrill,examintro:()=>go("examintro"),examstart:startExam,
  resume:()=>{S=P.session;if(S.mode==="exam"){if(Date.now()>=S.end){finishExam(true);return;}go("exam");}else go("quiz");},
  discard:()=>{P.session=null;save();render();},
  next, reset:()=>{homeConfirm=true;renderHome();}, resetno:()=>{homeConfirm=false;renderHome();},
  resetyes:()=>{P={qs:{},xp:0,best:0,exams:[],session:null};save();BOARD=null;homeConfirm=false;renderHome();toast("Progress erased. Fresh start!");},
  prev:()=>{if(S.i>0){S.i--;save();render();}}, flag:()=>{S.items[S.i].flag=!S.items[S.i].flag;P.session=S;save();render();},
  navtoggle:()=>{S.nav=!S.nav;render();},
  enext:()=>{if(S.items[S.i].pick===null)return;if(S.i+1<S.items.length){S.i++;P.session=S;save();render();window.scrollTo({top:0});}else{S.review=true;S.confirm=false;render();}},
  backtoexam:()=>{S.review=false;render();}, submit:()=>{S.confirm=true;render();}, submitno:()=>{S.confirm=false;render();}, submityes:()=>finishExam(false),
  revmissed:()=>{S.allRev=false;render();}, revall:()=>{S.allRev=true;render();},
  auth:()=>{authMsg="";if(authMode==="reset")authMode="signin";go("auth");}, authin:()=>{keepEmail();authMode="signin";authMsg="";canResend=false;render();}, authup:()=>{keepEmail();authMode="signup";authMsg="";canResend=false;render();},
  authforgot:()=>{keepEmail();authMode="forgot";authMsg="";canResend=false;render();}, authresend:resendConfirm,
  board:()=>go("board"), boardreload:()=>{BOARD=null;boardErr="";render();}, signout:()=>{clearTimeout(cloudTimer);SB.auth.signOut();}
 }[a]||(()=>{}))();
});
document.addEventListener("keydown",e=>{
 if(e.metaKey||e.ctrlKey||e.altKey)return;if(/INPUT|TEXTAREA|SELECT/.test((e.target.tagName||"")))return;
 const k=e.key.toLowerCase();const idx="abcd".indexOf(k)>=0?"abcd".indexOf(k):"1234".indexOf(k);
 if(view==="quiz"&&S){const it=S.items[S.i];if(it.pick===null&&idx>=0&&k.length===1){e.preventDefault();answer(idx);}else if(it.pick!==null&&k==="enter"&&e.target.tagName!=="BUTTON"){e.preventDefault();next();}}
 else if(view==="exam"&&S&&!S.review&&idx>=0&&k.length===1){e.preventDefault();S.items[S.i].pick=idx;P.session=S;save();render();}
});

/* ---------- confetti ---------- */
const cvs=$("#fx"),ctx=cvs.getContext("2d");let parts=[],raf=null;
const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function size(){cvs.width=innerWidth*devicePixelRatio;cvs.height=innerHeight*devicePixelRatio;}size();addEventListener("resize",size);
function burst(x,y){if(reduce)return;const cs=getComputedStyle(document.documentElement);const cols=["--d1","--d2","--d3","--d4","--d5","--gold","--accent"].map(c=>cs.getPropertyValue(c).trim());
 for(let i=0;i<34;i++){const a=Math.random()*Math.PI*2,v=3+Math.random()*6;parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-4,r:3+Math.random()*4,c:cols[i%cols.length],life:60+Math.random()*30,rot:Math.random()*6,sq:Math.random()<.5});}
 if(!raf)raf=requestAnimationFrame(step);}
function step(){ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.clearRect(0,0,innerWidth,innerHeight);
 parts=parts.filter(p=>p.life-->0);parts.forEach(p=>{p.vy+=.25;p.vx*=.98;p.x+=p.vx;p.y+=p.vy;p.rot+=.2;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=Math.min(1,p.life/25);ctx.fillStyle=p.c;if(p.sq)ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);else{ctx.beginPath();ctx.arc(0,0,p.r,0,7);ctx.fill();}ctx.restore();});
 raf=parts.length?requestAnimationFrame(step):(ctx.clearRect(0,0,innerWidth,innerHeight),null);}

/* ---------- boot ---------- */
Promise.all([fetch("questions.json").then(r=>{if(!r.ok)throw new Error(r.status);return r.json();}),fetch("questions-set2.json").then(r=>r.ok?r.json():[]).catch(()=>[])]).then(([d1,d2])=>{
 d1.forEach(q=>q.set=1);d2.forEach(q=>q.set=2);ALL=d1.concat(d2);const data=ALL;
 useSet(P.set||"all");
 return initCloud().catch(e=>console.warn(e)).then(()=>{
 if(P.session&&P.session.items&&P.session.items.some(x=>!BY.id[x.id]))P.session=null;
 render();});
}).catch(err=>{app().innerHTML=`<section class="card"><h2>The question bank didn't load</h2><p class="muted">Reload the page to try again. (${esc(err.message)})</p></section>`;});
})();
